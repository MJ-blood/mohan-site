<div class="container archive-container" data-archive>
  <header class="page-intro archive-intro"><h1>文章与思考。</h1><p>关于 AI、技术与产品，也关于如何把知识变成自己的东西。</p></header>
  <div class="archive-layout">
    <div class="archive-tools" aria-label="查找文章" hidden>
      <form class="search-form" role="search"><label class="visually-hidden" for="article-search">搜索文章</label><div class="search-field"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="article-search" name="q" type="search" placeholder="搜索标题、关键词或正文" autocomplete="off"></div></form>
      <details class="topic-picker"><summary>主题：<span data-topic-label>全部</span><span class="disclosure-icon" aria-hidden="true"></span></summary><div class="topic-filters" role="group" aria-label="文章主题">$topic_filters</div></details>
    </div>
    <div class="archive-results"><div class="results-caption"><span>按最近更新排列</span><span id="result-count" role="status" aria-live="polite">共 $article_count 篇</span></div>$archive_rows<div class="archive-empty" hidden><h2>暂时没有找到。</h2><p>试试更短的关键词，或查看全部文章。</p><button class="button button-secondary" type="button" data-clear-search>清除筛选</button></div></div>
  </div>
  <script type="application/json" id="article-search-index">$search_index</script>
</div>
